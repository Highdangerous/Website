<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="../shared/theme.js" defer></script>
</head>
<body>
  <header class="nav">
    <a href="../" class="logo">YN<span>.</span></a>
    <nav>
      <a href="../#projects">Projects</a>
      <button id="theme-toggle" aria-label="Toggle dark mode">◐</button>
    </nav>
  </header>
  <main>
    <p class="eyebrow">Project</p>
    <h1>Weather</h1>
    <form id="search">
      <input id="city" type="text" placeholder="Search a city…" autocomplete="off" required>
      <button type="submit" class="btn">Search</button>
      <button type="button" id="units" title="Switch units">°C</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="current" class="card" hidden>
      <h2 id="place"></h2>
      <p class="temp"><span id="temp"></span></p>
      <p id="desc"></p>
      <p class="meta">Feels like <span id="feels"></span> · Wind <span id="wind"></span> · Humidity <span id="humidity"></span></p>
    </section>

    <section id="forecast" class="card" hidden>
      <h3>7-day forecast</h3>
      <ul id="days"></ul>
    </section>

    <p class="credit">Data by <a href="https://open-meteo.com/">Open-Meteo</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
